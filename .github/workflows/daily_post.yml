name: Daily Auto Post to WordPress

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 오전 09:00)에 실행
    - cron: '0 0 * * *'
  # GitHub 웹에서 수동으로 "Run workflow" 버튼을 눌러 즉시 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Post Script
        env:
          WP_URL: ${{ secrets.WP_URL || 'https://tripgaja.co.kr' }}
          WP_USERNAME: ${{ secrets.WP_USERNAME || 'tripgajagpt@gmail.com' }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD || 'dg6i NgEG Jp0q yNTr Ny2v fZiL' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'auto' }}
        run: |
          python auto_post.py

      - name: Commit & push updated queue and history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topics_queue.json data/published_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update published history and topics queue [skip ci]" && git push)
